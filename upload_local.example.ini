[upload]
# Stable local settings only. Never add port/upload_port/monitor_port here.
firmware = ext_mod/ESP32_GENERIC_S3_2026_08_21_06_01_18.bin
source = slave
uploader = test/protocol/night_run/repl_upload.py

# Optional board profile. When set, it is uploaded first as /config.json.
# Required before using: all --erase
device_config =

chip = esp32s3
baud = 460800
address = 0x0
esptool = esptool.py
mpremote = uvx mpremote
reconnect_seconds = 3
